<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>Document</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        
  <div id="layout">

    
    <div id="thumbnail-column">
      <img src="images/thumb1.jpeg" alt="AirPods thumbnail 1">

      <h1>Apple AirPods Pro (2nd Generation)</h1>

      <p>
        Sold by:
        <a href="#">BestAudioDeals</a><br>

        <a href="#">Contact seller</a>
      </p>

      <h2>$189.99</h2>

      <button class="buy-btn">Buy Now</button>

  </div>
