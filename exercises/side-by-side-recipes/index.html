<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>side by side recipe</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="container">
            <div class="recipe-intro">
                <div class="recipe-image">
                    <img src="images/crunchwrap.jpg.webp" alt="main"> 
                </div>

                <div class="recipe-text">
                    <h1>CrunchWrap Supreme</h1>
                    <p>These Crunchwrap supremes are my version of Taco Bell at 
                        home, but better! Every bite hits that perfect balance 
                        of savorty, crunchy,and cheesy
                    </p>
                </div>
        </div>

        <h2 class="section-title">You Might AlsoLike</h2>

        <div class="card-container">

            <div class="card">
                <img src="images/muffins.jpg.webp" alt="">
                <h3>banana french tooast muffins</h3>
            </div>
            
            <div class="card">
                <img src="images/ratatouille.jpg.webp" alt="">
                <h3>ratatouille</h3>
            </div>

            <div class="card">
                <img src="images/sausage.jpg.webp" alt="">
                <h3>Beef and Lamb sausage rolls</h3>
            </div>
        </div>
    </body>
</html>
